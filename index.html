<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Imposter Web Game</title>
 <!-- Favicon is coded into HTML. Alternate method is to create a .ico file -->
 <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️‍♂️</text></svg>">
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="game-container">
     <div id="home-screen" class="screen active">
         <h1>🕵️‍♂️ Imposter</h1>
         <div class="card">
             <h3>Create a Room</h3>
             <div class="input-group">
                 <label for="imposter-count">Number of Imposters:</label>
                 <input type="number" id="imposter-count" min="1" max="3" value="1">
             </div>
             <div class="input-group checkbox-group">
                <input type="checkbox" id="give-imposter-fake-word">
                <label for="give-imposter-fake-word" class="label-inline">Give Imposters a fake random word</label>
            </div>
             <button id="btn-create-room" class="btn-primary">Host Game</button>
         </div>
         
         <div class="divider">OR</div>
         
         <div id="join-card" class="card">
             <h3>Join a Room</h3>
             <div class="input-group">
                 <input type="text" id="join-room-id" placeholder="Enter Room Code">
             </div>
             <button id="btn-submit-code" class="btn-secondary">Next</button>
         </div>
     </div>

     <div id="name-screen" class="screen">
         <h2>Identify Yourself</h2>
         <p>Room: <span id="display-room-id" class="highlight"></span></p>
         <div class="card">
             <div class="input-group">
                 <input type="text" id="player-name" placeholder="Your Name" maxlength="15">
             </div>
             <p id="name-error" class="error-msg"></p>
             <button id="btn-join-game" class="btn-primary">Join Room</button>
         </div>
     </div>

     <div id="lobby-screen" class="screen">
         <h2>Waiting Lobby</h2>
         <div class="room-share">
             <p>Share Room Code: <strong id="lobby-code">XXXX</strong></p>
             <button id="btn-copy-link" class="btn-sm">Copy Link</button>
         </div>
         
         <div class="card">
             <h3>Players Connected (<span id="player-count">0</span>)</h3>
             <ul id="player-list">
                 </ul>
         </div>
         
         <div id="host-controls" class="host-only">
             <button id="btn-start-game" class="btn-primary">Start Game</button>
             <button id="btn-close-room" class="btn-secondary" style="background-color: var(--warning); margin-top: 20px;">Close Room</button>
             <button id="btn-close-all-rooms" class="btn-secondary" style="background-color: var(--danger); margin-top: 20px;">Close All Rooms</button>
         </div>
         <p id="lobby-status" class="status-msg">Waiting for host to start...</p>
     </div>

     <div id="game-screen" class="screen">
        <h2>Game In Progress</h2>
        <p style="text-align: center; margin-bottom: 1rem; color: var(--text-muted);">
            Room Code: <strong id="game-room-code" class="highlight">XXXX</strong>
        </p>
        
        <div class="card reveal-card">
            <p>Click and hold the button below to see your secret identity.</p>
            <div id="secret-display" class="secret-box hidden-word">CONFIDENTIAL</div>
            <button id="btn-reveal" class="btn-reveal">Hold to Reveal</button>
        </div>
        
        <div id="host-end-controls" class="host-only">
            <button id="btn-reset-game" class="btn-secondary">Back to Lobby</button>
        </div>
    </div>
</div>

 <script type="module" src="app.js"></script>
</body>
</html>
